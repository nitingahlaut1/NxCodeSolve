<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 224" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGrad11" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow11" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(52, 211, 153, 0.35)" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="2" y="2" width="456" height="220" rx="12" fill="url(#bgGrad11)" stroke="#1e293b" stroke-width="1.5" filter="url(#glow11)" />

  <!-- Header Section -->
  <rect x="18" y="14" width="424" height="32" rx="8" fill="rgba(52, 211, 153, 0.12)" stroke="rgba(52, 211, 153, 0.3)" stroke-width="1"/>
  <text x="30" y="35" fill="#34d399" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">PATTERN 11 : BINARY NUMBER TRIANGLE PATTERN</text>
  <text x="430" y="35" fill="#94a3b8" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="end">N = 4</text>

  <!-- Pattern Visual Content -->
  <g class="pattern-lines">
    <text x="18" y="80" fill="#475569" font-family="ui-monospace, monospace" font-size="11" text-anchor="end">1</text>
    <text x="42" y="80" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15" font-weight="600" xml:space="preserve">1</text>
    <text x="18" y="104" fill="#475569" font-family="ui-monospace, monospace" font-size="11" text-anchor="end">2</text>
    <text x="42" y="104" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15" font-weight="600" xml:space="preserve">0 1</text>
    <text x="18" y="128" fill="#475569" font-family="ui-monospace, monospace" font-size="11" text-anchor="end">3</text>
    <text x="42" y="128" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15" font-weight="600" xml:space="preserve">1 0 1</text>
    <text x="18" y="152" fill="#475569" font-family="ui-monospace, monospace" font-size="11" text-anchor="end">4</text>
    <text x="42" y="152" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15" font-weight="600" xml:space="preserve">0 1 0 1</text>
  </g>
</svg>